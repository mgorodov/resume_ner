# MLflow tracking server + MinIO (S3-compatible storage) + Postgres backend.
#
# Start:   docker compose -f mlflow/docker-compose.mlflow.yaml up -d
# Stop:    docker compose -f mlflow/docker-compose.mlflow.yaml down
# UI:      http://localhost:5000   (MLflow)
# MinIO:   http://localhost:9001   (login: minioadmin / minioadmin)

services:
  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mlflow_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        echo 'Bucket mlflow-artifacts ready';
      "

  postgres:
    image: postgres:16
    container_name: mlflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5433:5432"  # 5433 host -> 5432 container (5432 host occupied)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: mlflow_server
    restart: unless-stopped
    ports:
      - "5001:5000"  # host 5001 -> container 5000 (macOS occupies 5000 with AirPlay)
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - "sh"
      - "-c"
      - |
        pip install --quiet psycopg2-binary boto3 && \
        mlflow server \
          --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow \
          --default-artifact-root s3://mlflow-artifacts/ \
          --host 0.0.0.0 \
          --port 5000 \
          --serve-artifacts

volumes:
  minio_data:
  postgres_data:
